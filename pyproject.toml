[project]
name = "grapht5-replication"
version = "0.1.0"
description = "GraphT5 multi-modal AVR architecture"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "codebleu==0.7.0",
    "loguru",
    "matplotlib",
    "msgspec",
    "numpy",
    "regex",
    "rich",
    "safetensors",
    "seaborn",
    "tensorboard",
    "torch==2.10.0",
    "tqdm",
    "transformers==4.49.0",
    "wandb>=0.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
grapht5-train = "grapht5.cli.train:main"
grapht5-eval = "grapht5.cli.eval:main"
grapht5-pack-dataset = "grapht5.cli.pack_dataset:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
